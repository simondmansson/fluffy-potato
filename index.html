<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thunder Dragon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="game">
    <div id="scene"></div>
    <div id="minigame" hidden></div>

    <header id="hud">
      <div class="hud-box hud-left">
        <div id="location-name"></div>
        <div id="player-name" hidden></div>
      </div>
      <div class="hud-right">
        <div class="hud-box" id="inventory" hidden>
          <span class="inv-item" data-item="axe" hidden>
            <svg class="item-icon" viewBox="0 0 32 32" aria-hidden="true">
              <line x1="27" y1="29" x2="11" y2="8" stroke="#a0754a" stroke-width="4" stroke-linecap="round"/>
              <path d="M9 3 L18 10 L13 16 Q5 16 2 9 Q4 5 9 3 Z" fill="#cfd6dc" stroke="#4a4f55" stroke-width="1.2"/>
            </svg>
            <span class="inv-label">Yxa</span>
          </span>
          <span class="inv-item" data-item="rod" hidden>
            <svg class="item-icon" viewBox="0 0 32 32" aria-hidden="true">
              <line x1="4" y1="29" x2="25" y2="3" stroke="#a0754a" stroke-width="3" stroke-linecap="round"/>
              <circle cx="9" cy="23" r="4" fill="#3e4a52" stroke="#cfd6dc" stroke-width="1"/>
              <path d="M25 3 Q28 10 28 17" fill="none" stroke="#e8e8e8" stroke-width="1"/>
              <circle cx="28" cy="20" r="3" fill="#d8283f"/>
            </svg>
            <span class="inv-label">Fiskespö</span>
          </span>
          <span class="inv-item" data-item="harpoon" hidden>
            <svg class="item-icon" viewBox="0 0 32 32" aria-hidden="true">
              <line x1="29" y1="29" x2="10" y2="10" stroke="#a0754a" stroke-width="3.5" stroke-linecap="round"/>
              <polygon points="2,2 15,7 11,9 9,11 7,15" fill="#cfd6dc" stroke="#4a4f55" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
            <span class="inv-label">Harpun</span>
          </span>
          <span class="inv-item" data-item="torch" hidden>
            <svg class="item-icon" viewBox="0 0 32 32" aria-hidden="true">
              <line x1="22" y1="30" x2="14" y2="14" stroke="#8a5e36" stroke-width="4" stroke-linecap="round"/>
              <rect x="10" y="11" width="8" height="5" rx="1" fill="#4a3a2a" transform="rotate(-27 14 13)"/>
              <path d="M11 2 C9 6 5 8 7 12 C8 14 12 14 14 12 C16 9 13 7 11 2 Z" fill="#f07a1a"/>
              <path d="M11 7 C10 9 8 10 9 12 C10 13 12 13 13 11 C13 10 12 9 11 7 Z" fill="#ffc94a"/>
            </svg>
            <span class="inv-label">Fackla</span>
          </span>
        </div>
        <div class="hud-box" id="rubies">
          <span class="ruby-icon" aria-hidden="true"></span>
          <span>Rubiner: <span id="ruby-count">0</span>/4</span>
        </div>
        <div class="hero-menu">
          <button type="button" class="hud-box" id="hero-btn" aria-haspopup="true" aria-expanded="false" aria-controls="hero-list">
            Byt hjälte <span aria-hidden="true">▾</span>
          </button>
          <div class="hud-box" id="hero-list" hidden>
            <ul id="hero-players"></ul>
            <button type="button" class="hero-new" id="hero-new">+ Ny hjälte</button>
          </div>
        </div>
      </div>
    </header>

    <p class="hud-box" id="narration" aria-live="polite"></p>

    <section id="start" aria-labelledby="start-title">
      <div class="start-bg" aria-hidden="true" inert></div>
      <div class="start-panel hud-box">
        <h1 id="start-title">Thunder Dragon</h1>
        <p class="start-tagline">Samla rubinerna och besegra åskdraken på toppen av Mount Thunder.</p>

        <div id="start-continue" hidden>
          <p class="start-or">Fortsätt med en hjälte</p>
          <div id="start-players"></div>
          <p class="start-or">eller börja ett nytt äventyr</p>
        </div>

        <form id="new-game-form" autocomplete="off">
          <label for="name-input">Vad heter din nya hjälte?</label>
          <input id="name-input" name="name" type="text" maxlength="20" placeholder="Skriv ett namn" required>
          <button type="submit" class="start-btn" id="new-game-btn">Starta spelet</button>
        </form>
        <p class="start-note" id="full-note" hidden>Det finns redan 8 hjältar – fortsätt med en av dem.</p>
        <button type="button" class="start-link" id="start-cancel" hidden>Tillbaka till spelet</button>
      </div>
    </section>
  </main>

  <!-- Plain scripts (no ES modules) so the game works when opened via file:// -->
  <script src="js/state.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/forest.js"></script>
  <script src="js/lake.js"></script>
  <script src="js/cave.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
